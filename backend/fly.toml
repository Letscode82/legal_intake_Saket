# Fly.io deployment for the AEGIS FastAPI backend.
# `fly launch --no-deploy` once to create the app, then set secrets:
#   fly secrets set DATABASE_URL=... ANTHROPIC_API_KEY=... AUTH0_DOMAIN=... \
#     AUTH0_AUDIENCE=... ENCRYPTION_KEY=... FRONTEND_ORIGINS=https://<vercel-app>
# then `fly deploy`. The release_command runs migrations before the new
# version takes traffic.

app = "aegis-backend"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[deploy]
  release_command = "alembic upgrade head"

[env]
  ENVIRONMENT = "production"
  PORT = "8000"
  WEB_CONCURRENCY = "2"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1

  [http_service.checks]
    [http_service.checks.health]
      method = "GET"
      path = "/health"
      interval = "15s"
      timeout = "2s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
