[project]
name = "aegis-backend"
version = "0.1.0"
description = "AEGIS legal operations platform — FastAPI backend. Owns all business logic, data access, the AI agents, the audit chain, and permissions."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "gunicorn>=23.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "pyjwt[crypto]>=2.10",
    "httpx>=0.28",
    "anthropic>=0.42",
    "python-multipart>=0.0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "asgi-lifespan>=2.1",
]
# In-process embeddings (EMBEDDINGS_PROVIDER=local) — no model server to
# host. fastembed is ONNX-based (no torch), so the install stays light.
local-embeddings = [
    "fastembed>=0.3",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]
addopts = "-ra -q"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
